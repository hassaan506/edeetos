<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Vault - EDEETOS</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="vault.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Parses Markdown to HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script> 
</head>
<body>
    <nav class="vault-nav">
        <button onclick="window.location.href='dashboard.html'" class="btn-outline">⬅ Back to Dashboard</button>
        <h2>Study Vault</h2>
        <span id="vault-user-status" class="badge">Checking Access...</span>
    </nav>

    <div class="vault-container">
        <!-- Sidebar Navigation -->
        <aside class="vault-sidebar" id="vault-sidebar">
            <p>Loading syllabus...</p>
        </aside>

        <!-- Main Reading Area -->
        <main class="vault-content glass-panel" id="vault-content">
            <div class="empty-state">
                <i class="fas fa-book-medical" style="font-size: 3rem; color: #cbd5e1; margin-bottom: 1rem;"></i>
                <h3>Select a topic to start studying</h3>
            </div>
        </main>
    </div>

    <!-- Premium Lock Modal -->
    <div id="vault-premium-modal" class="popup-overlay" style="display: none;">
        <div class="glass-panel popup-content" style="text-align: center; padding: 2rem;">
            <i class="fas fa-lock" style="font-size: 3rem; color: #ef4444; margin-bottom: 1rem;"></i>
            <h3>Premium Content Locked</h3>
            <p style="color: #64748b; margin-bottom: 1.5rem;">You need an active subscription to access these detailed notes.</p>
            <button onclick="window.location.href='dashboard.html'" class="btn-solid" style="background: #10b981;">Upgrade Now</button>
            <button onclick="document.getElementById('vault-premium-modal').style.display='none'" class="btn-outline" style="margin-top: 10px;">Close</button>
        </div>
    </div>

    <script type="module" src="vault.js"></script>
</body>
</html>
