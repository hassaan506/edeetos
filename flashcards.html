<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Recall - EDEETOS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="flashcards.css">
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark-mode');
        }
    </script>
</head>
<body>

    <nav class="navbar">
        <div class="brand-title">EDEETOS | Active Recall</div>
        <div style="display: flex; gap: 12px; align-items: center;">
            <button id="dark-mode-toggle" class="btn"><i class="fas fa-moon"></i></button>
            <button onclick="window.location.href='dashboard.html'" class="btn">Exit</button>
        </div>
    </nav>

    <!-- SYSTEM / TOPIC SELECTION -->
    <main class="container" id="selection-screen">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px;">
            <div>
                <h2 id="selection-title">Select a System</h2>
                <p id="selection-subtitle" class="subtitle">Choose a medical system to begin reviewing.</p>
            </div>
            <button id="btn-back" class="btn" style="display: none;">Back</button>
        </div>
        
        <div id="deck-grid" class="grid">
            <div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); font-family: var(--font-mono);">
                Loading available systems...
            </div>
        </div>
    </main>

<!-- FLASHCARD UI (NARROW CENTERED COLUMN) -->
    <main class="container" id="training-screen" style="display: none;">
        <div class="fc-training-wrapper">
            
            <div class="fc-toolbar">
                <button id="btn-back-decks" class="btn">Back to Topics</button>
                <div class="fc-stats">
                    Card 
                    <input type="number" id="fc-jump-input" class="jump-input" min="1" value="1">
                    <span id="fc-progress-total">of 0</span>
                    <button id="btn-jump" class="btn btn-primary" style="padding: 4px 12px; margin-left: 8px;">Jump</button>
                </div>
            </div>
            
            <div class="fc-perspective" id="flashcard-container">
                <div class="fc-inner" id="flashcard-inner">
                    
                    <!-- FRONT OF CARD -->
                    <div class="fc-face fc-front">
                        <div class="fc-meta" id="fc-meta">System > Topic</div>
                        
                        <div class="fc-content-wrapper">
                            <div class="fc-question" id="fc-stem">Loading question...</div>
                            <div id="fc-image-front" class="fc-image-box" style="display: none;">
                                <img src="" alt="Clinical Image">
                            </div>
                        </div>

                        <div class="fc-click-hint">CLICK CARD TO REVEAL</div>
                    </div>

                    <!-- BACK OF CARD -->
                    <div class="fc-face fc-back">
                        <div class="fc-meta">Verified Answer</div>
                        
                        <div class="fc-content-wrapper">
                            <div id="fc-answer" class="fc-answer">Loading answer...</div>
                            <div id="fc-trick-container" style="display: none;">
                                <div id="fc-trick" class="fc-trick"></div>
                            </div>
                            <div id="fc-image-back" class="fc-image-box" style="display: none;">
                                <img src="" alt="Explanation Image">
                            </div>
                        </div>
                        
                        <div class="fc-click-hint" style="color: var(--text-muted);">SELECT AN OUTCOME BELOW</div>
                    </div>
                    
                </div>
            </div>

            <div class="fc-action-bar">
                <button id="btn-prev-card" class="btn" style="display: none;">Previous</button>
                
                <div id="fc-eval-controls" class="eval-buttons" style="display: none;">
                    <button class="btn btn-danger" id="btn-eval-hard">Review Again</button>
                    <button class="btn btn-success" id="btn-eval-easy">Got It</button>
                </div>
            </div>

        </div>
    </main>

    <script type="module" src="flashcards.js"></script>
</body>
</html>
