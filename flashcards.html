<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards - EDEETOS</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="flashcards.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="fc-body">

    <nav class="navbar">
        <div class="nav-container" style="display: flex; justify-content: space-between; width: 100%; padding: 0 1rem;">
            <div style="display: flex; align-items: center; gap: 1rem;">
                <a href="dashboard.html" class="nav-logo">
                    <img src="Pictures/logo_transparent.png" alt="EDEETOS Logo" style="height: 40px; width: auto;">
                </a>
                <h3 style="color: #a855f7; margin: 0; font-size: 1.2rem; font-weight: 900;">Flashcard Engine</h3>
            </div>
            <button onclick="window.location.href='dashboard.html'" class="btn-outline" style="padding: 0.5rem 1rem;">Exit</button>
        </div>
    </nav>

    <!-- DECK SELECTION SCREEN -->
    <section class="section-container" id="fc-selection-screen">
        <div style="text-align: center; margin-bottom: 3rem;">
            <h2 style="color: #1e293b; font-size: 2.5rem;">Select a Deck</h2>
            <p style="color: #64748b;">Choose a system to begin active recall training.</p>
        </div>
        <div id="deck-grid" class="deck-grid">
            <div style="text-align: center; color: #94a3b8; width: 100%;"><i class="fas fa-spinner fa-spin"></i> Loading decks...</div>
        </div>
    </section>

    <!-- FLASHCARD TRAINING SCREEN -->
    <section class="section-container" id="fc-training-screen" style="display: none; max-width: 800px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <button id="btn-back-decks" class="btn-outline" style="border: none; padding: 0.5rem;"><i class="fas fa-arrow-left"></i> Decks</button>
            <div id="fc-progress-text" style="font-weight: 800; color: #a855f7; font-size: 1.1rem;">1 / 10</div>
        </div>

        <div class="flashcard-container" id="flashcard-container">
            <div class="flashcard-inner" id="flashcard-inner">
                
                <!-- FRONT OF CARD -->
                <div class="flashcard-front">
                    <div id="fc-meta" style="font-size: 0.75rem; color: #94a3b8; font-weight: 800; text-transform: uppercase; margin-bottom: 1rem; letter-spacing: 0.5px;">System > Chapter</div>
                    <div id="fc-high-yield" style="display: none; position: absolute; top: 2rem; right: 2rem; background: #fee2e2; color: #ef4444; padding: 4px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: 900; border: 1px solid #fca5a5;">🔥 HIGH YIELD</div>
                    
                    <div id="fc-stem" style="font-size: 1.4rem; font-weight: 700; color: #0f172a; line-height: 1.6; text-align: justify; margin-top: auto; margin-bottom: auto;">Loading question...</div>
                    
                    <div id="fc-image-front" style="display: none; text-align: center; margin: 1rem 0;">
                        <img src="" style="max-width: 100%; max-height: 200px; border-radius: 8px; border: 1px solid #e2e8f0;">
                    </div>

                    <div style="text-align: center; font-size: 0.85rem; color: #94a3b8; font-weight: 800; border-top: 1px dashed #e2e8f0; padding-top: 1rem; margin-top: 2rem;"><i class="fas fa-hand-pointer"></i> Click card or press SPACE to flip</div>
                </div>

                <!-- BACK OF CARD -->
                <div class="flashcard-back">
                    <div style="font-size: 0.8rem; color: #10b981; font-weight: 900; text-transform: uppercase; margin-bottom: 0.5rem;"><i class="fas fa-check-circle"></i> Answer</div>
                    <div id="fc-answer" style="font-size: 1.2rem; font-weight: 800; color: #064e3b; background: #ecfdf5; padding: 15px; border-radius: 12px; border: 1px solid #a7f3d0; margin-bottom: 1.5rem;">The answer.</div>

                    <div id="fc-trick-container" style="display: none; margin-bottom: 1.5rem;">
                        <div style="font-size: 0.8rem; color: #d97706; font-weight: 900; text-transform: uppercase; margin-bottom: 0.5rem;"><i class="fas fa-magic"></i> Trick / Mnemonic</div>
                        <div id="fc-trick" style="font-size: 1.05rem; color: #b45309; background: #fffbeb; padding: 15px; border-radius: 12px; border: 1px dashed #fcd34d; font-weight: 600;">The trick.</div>
                    </div>

                    <div id="fc-image-back" style="display: none; text-align: center; margin-bottom: 1.5rem;">
                        <img src="" style="max-width: 100%; max-height: 200px; border-radius: 8px; border: 1px solid #e2e8f0;">
                    </div>
                </div>
                
            </div>
        </div>

        <!-- RECALL BUTTONS (Only visible when flipped) -->
        <div id="fc-controls" style="display: none; gap: 1rem; width: 100%; margin-top: 2rem;">
            <button class="fc-eval-btn btn-outline" data-eval="hard" style="flex: 1; border-color: #ef4444; color: #ef4444; font-weight: 800; font-size: 1.1rem; padding: 1rem;"><i class="fas fa-times-circle"></i> Hard (Forgot)</button>
            <button class="fc-eval-btn btn-solid" data-eval="easy" style="flex: 1; background: #10b981; border: none; font-weight: 800; font-size: 1.1rem; padding: 1rem;"><i class="fas fa-check-circle"></i> Easy (Got It)</button>
        </div>
    </section>

    <script type="module" src="flashcards.js"></script>
</body>
</html>
