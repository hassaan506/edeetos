<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards - EDEETOS</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="flashcards.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="fc-body">

    <nav class="navbar">
        <div class="nav-container" style="display: flex; justify-content: space-between; width: 100%; padding: 0 1rem;">
            <div style="display: flex; align-items: center; gap: 1rem;">
                <a href="dashboard.html" class="nav-logo">
                    <img src="Pictures/logo_transparent.png" alt="EDEETOS Logo" style="height: 40px; width: auto;">
                </a>
                <h3 style="color: #a855f7; margin: 0; font-size: 1.2rem; font-weight: 900;">Active Recall</h3>
            </div>
            <button onclick="window.location.href='dashboard.html'" class="btn-outline" style="padding: 0.5rem 1rem;">Exit</button>
        </div>
    </nav>

    <!-- DECK SELECTION SCREEN -->
    <section class="section-container" id="fc-selection-screen">
        <div style="text-align: center; margin-bottom: 3rem; position: relative; display: flex; flex-direction: column; align-items: center;">
            <div style="width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <button id="btn-back-systems" class="fc-glass-btn" style="display: none;"><i class="fas fa-arrow-left"></i> Back</button>
                <div style="flex-grow: 1;"></div>
            </div>
            <h2 id="selection-title" style="color: #1e293b; font-size: 2.5rem; font-weight: 900; letter-spacing: -1px; margin: 0;">Select a System</h2>
            <p id="selection-subtitle" style="color: #64748b; font-size: 1.1rem;">Choose a deck to begin rapid memorization.</p>
        </div>
        <div id="deck-grid" class="deck-grid">
            <div style="text-align: center; color: #94a3b8; width: 100%;"><i class="fas fa-spinner fa-spin"></i> Loading decks...</div>
        </div>
    </section>

    <!-- FLASHCARD TRAINING SCREEN -->
    <section class="section-container" id="fc-training-screen" style="display: none; max-width: 900px; padding: 2rem 1rem;">
        
        <div class="fc-header-bar">
            <!-- Modern Glassy Back Button -->
            <button id="btn-back-decks" class="fc-glass-btn"><i class="fas fa-arrow-left"></i> Back to Decks</button>
            <div class="fc-progress-pill">
                <i class="fas fa-layer-group"></i> <input type="number" id="fc-jump-input" class="fc-jump-input" min="1" value="1"><span id="fc-progress-total"> / 10</span>
            </div>
        </div>
        
        <div class="flashcard-container" id="flashcard-container">
            <div class="flashcard-inner" id="flashcard-inner">
                
                <!-- FRONT OF CARD -->
                <div class="flashcard-front">
                    <div class="fc-meta-bar">
                        <span id="fc-meta">System > Chapter</span>
                        <span id="fc-high-yield" class="high-yield-badge" style="display: none;">🔥 HIGH YIELD</span>
                    </div>
                    
                    <div class="fc-content-wrapper">
                        <div id="fc-stem" class="fc-stem-text">Loading question...</div>
                        <div id="fc-image-front" class="fc-image-box" style="display: none;">
                            <img src="" alt="Clinical Image">
                        </div>
                    </div>

                    <div class="fc-flip-hint"><i class="fas fa-hand-pointer"></i> Click card or press SPACE to reveal answer</div>
                </div>

                <!-- BACK OF CARD -->
                <div class="flashcard-back">
                    <div class="fc-content-wrapper">
                        <div class="fc-section-label"><i class="fas fa-check-circle"></i> Answer</div>
                        <div id="fc-answer" class="fc-answer-box">The answer.</div>

                        <div id="fc-trick-container" style="display: none; margin-top: 1.5rem;">
                            <div class="fc-section-label" style="color: #d97706;"><i class="fas fa-lightbulb"></i> Mnemonic / Trick</div>
                            <div id="fc-trick" class="fc-trick-box">The trick.</div>
                        </div>

                        <div id="fc-image-back" class="fc-image-box" style="display: none; margin-top: 1.5rem;">
                            <img src="" alt="Explanation Image">
                        </div>
                    </div>
                </div>
                
            </div>
        </div>

        <!-- NAVIGATION & RECALL CONTROLS -->
        <div class="fc-bottom-controls">
            <button id="btn-prev-card" class="fc-glass-btn prev-btn" style="display: none;"><i class="fas fa-arrow-left"></i> Previous</button>
            
            <div id="fc-eval-controls" class="eval-controls" style="display: none;">
                <!-- High-Contrast Modern Buttons -->
                <button class="control-btn hard-btn" id="btn-eval-hard"><i class="fas fa-redo"></i> Review Again</button>
                <button class="control-btn easy-btn" id="btn-eval-easy"><i class="fas fa-check"></i> Got It</button>
            </div>
        </div>

    </section>

    <script type="module" src="flashcards.js"></script>
</body>
</html>
