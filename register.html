<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form - EDEETOS</title>
    <link rel="stylesheet" href="global.css">
	<link rel="stylesheet" href="auth.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <img src="Pictures/logo_transparent.png" alt="EDEETOS Logo" class="logo-img">
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Back to Home</a></li>
            </ul>
        </div>
    </nav>

    <section class="section-container auth-wrapper">
        <div class="glass-panel auth-card wide-card">
            <h2>Registration Form</h2>
            <p class="section-description">Help us tailor your EDEETOS mentorship experience.</p>
            
            <form id="register-form" class="contact-form">
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="reg-name" placeholder="Dr. Hassaan Shahid" required>
                    </div>
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="reg-username" placeholder="Hassaan2026" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="reg-email" placeholder="hassaan@example.com" required>
                    </div>
                    <div class="form-group">
                        <label>Phone / WhatsApp</label>
                        <input type="tel" id="reg-phone" placeholder="+92 300 0000000" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Current Institution / University</label>
                        <input type="text" id="reg-uni" placeholder="Aga Khan University" required>
                    </div>
                    <div class="form-group">
                        <label>City / Country</label>
                        <input type="text" id="reg-location" placeholder="Karachi, Pakistan" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group" style="width: 100%;">
                        <label>Select Your Access Course</label>
                        <select id="reg-course" class="custom-select" required>
                            <option value="" disabled selected>Select the specific course you want to access...</option>
                            <option value="mbbs_year1">MBBS 1st Year</option>
                            <option value="mbbs_year2">MBBS 2nd Year</option>
                            <option value="mbbs_year3">MBBS 3rd Year</option>
                            <option value="mbbs_year4">MBBS 4th Year</option>
                            <option value="mbbs_year5">MBBS 5th Year</option>
                            <option value="fcps_imm">FCPS IMM</option>
                            <option value="fcps_part1">FCPS Part 1</option>
                            <option value="fcps_part2">FCPS Part 2</option>
                            <option value="mrcs_part1">MRCS Part 1</option>
                            <option value="mrcs_part2">MRCS Part 2</option>
                        </select>
                        <small style="color: #666; font-size: 0.85rem; margin-top: 5px; display: block;">
                            Note: You will only have access to this specific course. Changing it later requires Admin approval.
                        </small>
                    </div>
                </div>

                <div class="form-group" style="margin-top: 1rem;">
                    <label>Password</label>
                    <input type="password" id="reg-password" placeholder="Create a strong password" required>
                </div>

                <button type="submit" class="btn-solid form-btn">Create EDEETOS Account</button>
            </form>

            <p class="auth-footer">Already have an account? <a href="login.html">Log In</a></p>
        </div>
    </section>

    <script type="module" src="register.js"></script>
</body>
</html>
