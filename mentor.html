<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentorship Hub - EDEETOS</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="mentor.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <nav class="navbar navbar-container">
        <div style="display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; width: 100%;">
            <a href="dashboard.html" class="btn-outline" style="border: none; color: #64748b; text-decoration: none; display: flex; align-items: center; gap: 5px; flex: 1;">
                ⬅ Back
            </a>
            <div style="flex: 1; display: flex; justify-content: center; align-items: center;">
                <img src="Pictures/logo_transparent.png" alt="EDEETOS Logo" style="height: 40px; width: auto; object-fit: contain;">
            </div>
            <div style="flex: 1;"></div>
        </div>
    </nav>

    <section style="padding-top: 3rem; max-width: 800px; margin: 0 auto;">
        
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🩺</div>
            <h1 style="color: #1e293b; font-size: 2rem; margin-bottom: 0.5rem;">Mentorship Hub</h1>
            <p id="hub-subtitle" style="color: #64748b; font-size: 1rem;">Connect with a guide in real-time or leave a message.</p>
        </div>

        <!-- STUDENT VIEW -->
        <div id="student-view" style="display: none;">
            <div class="glass-panel">
                <h3 style="color: #064e3b; margin-top: 0; border-bottom: 2px solid #e2e8f0; padding-bottom: 0.5rem;">🟢 Online Mentors</h3>
                <div id="online-mentors-list"><p style="color: #94a3b8;">Loading...</p></div>
            </div>
            
            <div class="glass-panel">
                <h3 style="color: #475569; margin-top: 0; border-bottom: 2px solid #e2e8f0; padding-bottom: 0.5rem;">⚪ Offline Mentors (Leave a message)</h3>
                <div id="offline-mentors-list"><p style="color: #94a3b8;">Loading...</p></div>
            </div>
        </div>

        <!-- MENTOR VIEW -->
        <div id="mentor-view" class="glass-panel" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 0.5rem; margin-bottom: 1.5rem;">
                <h3 style="color: #b45309; margin: 0;">Student Requests & Messages</h3>
                <button id="toggle-status-btn" class="btn-outline" style="padding: 0.5rem 1rem; border-color: #10b981; color: #10b981;">
                    Go Online
                </button>
            </div>
            <div id="requests-list">
                <p style="text-align: center; color: #94a3b8;">No pending requests or offline messages.</p>
            </div>
        </div>

        <!-- CHAT VIEW -->
        <div id="live-chat-view" class="chat-container">
            <div class="chat-header">
                <div>
                    <h3 id="chat-partner-name" style="color: #064e3b; margin: 0;">Connected</h3>
                    <div id="chat-type-badge" style="font-size: 0.75rem; color: #10b981; font-weight: bold; margin-top: 3px;">🟢 Live Session</div>
                </div>
                <button id="btn-end-chat" class="btn-outline" style="border-color: #ef4444; color: #ef4444; font-size: 0.85rem; padding: 0.5rem 1rem;">
                    End & Purge Chat
                </button>
            </div>
            
            <div id="chat-messages" class="chat-messages">
                <div style="text-align: center; color: #94a3b8; font-size: 0.85rem; margin-top: auto;">Secure Chat Started</div>
            </div>
            
            <form id="chat-form" class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Type your message here..." required autocomplete="off">
                <button type="submit"><i class="fas fa-paper-plane"></i></button>
            </form>
        </div>

    </section>

    <script type="module" src="mentor.js"></script>
</body>
</html>
