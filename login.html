<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - EDEETOS</title>
    
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="auth.css">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="EDEETOS">
    <link rel="apple-touch-icon" href="/Pictures/icon-192.png">
    <script>if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark-mode');</script>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">EDEETOS.</a>
            <ul class="nav-links">
                <li><a href="index.html">Back to Home</a></li>
            </ul>
        </div>
    </nav>

    <section class="auth-wrapper">
        <div class="auth-card">
            <h2>Welcome Back</h2>
            <p class="section-description">Log in to access your study materials.</p>
            
            <form id="login-form" class="contact-form">
                <div class="form-group">
                    <label>Email or Username</label>
                    <input type="text" id="login-identifier" placeholder="hassaan@example.com" required>
                </div>
                
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                    <a href="#" id="forgot-password-link" style="font-size: 0.75rem; display: block; text-align: right; margin-top: 8px;">Forgot Password?</a>
                </div>

                <button type="submit" class="form-btn btn-solid">Log In</button>
            </form>
            
            <button id="btn-guest" class="form-btn btn-guest" style="margin-top: 1rem;">Continue as Guest</button>

            <p class="auth-footer">Don't have an account? <a href="register.html">Sign Up Here</a></p>
        </div>
    </section>

    <script type="module" src="login.js"></script>
</body>
</html>
